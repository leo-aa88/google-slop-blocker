version: 2
updates:
  # Dev tooling (ESLint, Prettier, jsdom, web-ext).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used in CI/CD.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
